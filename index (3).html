let categories = [];
let items = [];

// ── Supabase ──────────────────────────────────────────────────────
function setSyncDot(s) { const d=document.getElementById('sync-dot'); d.className='sync-dot'+(s?' '+s:''); }

async function dbGet(type) {
  const res = await fetch(`${API}?type=eq.${type}&select=*`, {headers:HEADERS});
  if (!res.ok) return null;
  const rows = await res.json();
  return rows.length ? rows[0].data : null;
}

async function dbSet(type, data) {
  setSyncDot('syncing');
  try {
    const check = await fetch(`${API}?type=eq.${type}&select=id`, {headers:HEADERS});
    const rows = await check.json();
    let res;
    if (rows.length > 0) {
      res = await fetch(`${API}?type=eq.${type}`, {
        method:'PATCH', headers:{...HEADERS,'Prefer':'return=minimal'},
        body:JSON.stringify({data, updated_at:new Date().toISOString()})
      });
    } else {
      res = await fetch(API, {
        method:'POST', headers:{...HEADERS,'Prefer':'return=minimal'},
        body:JSON.stringify({id:Date.now(),type,data,updated_at:new Date().toISOString()})
      });
    }
    if (res.ok) { setSyncDot('ok'); setTimeout(()=>setSyncDot(''),2000); }
    else setSyncDot('error');
  } catch(e) { setSyncDot('error'); }
}

async function loadAll() {
  try {
    const [c, it] = await Promise.all([dbGet('categories'), dbGet('items')]);
    categories = c || DEFAULT_CATEGORIES;
    items = it || DEFAULT_ITEMS;
    if (!c) dbSet('categories', categories);
    if (!it) dbSet('items', items);
  } catch(e) { categories = DEFAULT_CATEGORIES; items = DEFAULT_ITEMS; }
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  renderAll();
}

async function save() {
  await Promise.all([dbSet('categories', categories), dbSet('items', items)]);
}

// ── Confirm ───────────────────────────────────────────────────────
function showConfirm(title, msg, cb) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = msg;
  confirmCallback = cb;
  document.getElementById('confirm-overlay').style.display = 'flex';
}
function closeConfirm() { document.getElementById('confirm-overlay').style.display='none'; confirmCallback=null; }
document.getElementById('confirm-ok').onclick = () => { if(confirmCallback) confirmCallback(); closeConfirm(); };

// ── Queue ─────────────────────────────────────────────────────────
function renderQueue() {
  const grid = document.getElementById('queue-grid');
  if (!categories.length) { grid.innerHTML='<div class="empty">No categories yet.</div>'; return; }
  grid.innerHTML = categories.map(cat => {
    const catItems = items.filter(i=>i.category===cat).sort((a,b)=>a.position-b.position);
    const top = catItems[0];
    const remaining = catItems.length;
    if (!top) return `<div class="q-card"><div class="q-cat">${cat}</div><div class="q-body"><div class="q-title" style="color:#444">Empty</div></div></div>`;
    return `<div class="q-card">
      <div class="q-cat">${cat}</div>
      <div class="q-body">
        <div class="q-title">${top.title}</div>
        <div class="q-count">${remaining} item${remaining!==1?'s':''} in queue</div>
      </div>
      <button class="btn-done" onclick="markDone('${top.id.replace(/'/g,"\\'")}','${cat.replace(/'/g,"\\'")}','${top.title.replace(/'/g,"\\'")}')">Done ✓</button>
    </div>`;
  }).join('');
}

function markDone(id, cat, title) {
  showConfirm('Mark as done?', `"${title}" will be removed from ${cat} and the next item will move up.`, () => {
    items = items.filter(i=>i.id!==id);
    save(); renderAll();
  });
}

// ── Admin ─────────────────────────────────────────────────────────
function renderAdmin() {
  // Category list
  const catList = document.getElementById('cat-list');
  catList.innerHTML = categories.map((cat,ci) => `
    <div class="admin-item">
      <span class="admin-title" style="font-weight:600;">${cat}</span>
      <button class="admin-del" onclick="deleteCategory(${ci})" title="Delete category">✕</button>
    </div>`).join('');

  // Per-category item lists
  const lists = document.getElementById('admin-lists');
  lists.innerHTML = categories.map(cat => {
    const catItems = items.filter(i=>i.category===cat).sort((a,b)=>a.position-b.position);
    return `<div class="admin-section">
      <h3>${cat} <span style="font-weight:400;color:#444">${catItems.length} items</span></h3>
      <div id="list-${cat.replace(/[^a-zA-Z0-9]/g,'_')}">
        ${catItems.map((item,idx) => `
          <div class="admin-item">
            <span class="admin-pos">${idx+1}</span>
            <span class="admin-title">${item.title}</span>
            <button class="admin-del" onclick="deleteItem('${item.id.replace(/'/g,"\\'")}')" title="Remove">✕</button>
          </div>`).join('')}
      </div>
      <div class="add-item-row">
        <input type="text" id="new-item-${cat.replace(/[^a-zA-Z0-9]/g,'_')}" placeholder="Title..." />
        <select id="pos-${cat.replace(/[^a-zA-Z0-9]/g,'_')}">
          <option value="end">Add to end</option>
          ${catItems.map((_,i) => `<option value="${i}">After position ${i+1}</option>`).join('')}
          <option value="-1">Add to top</option>
        </select>
        <button class="btn-add" onclick="addItem('${cat.replace(/'/g,"\\'")}')">Add</button>
      </div>
    </div>`;
  }).join('');
}

function addCategory() {
  const input = document.getElementById('new-cat-input');
  const name = input.value.trim();
  if (!name) return;
  if (categories.includes(name)) { document.getElementById('cat-msg').textContent='Category already exists.'; return; }
  categories.push(name);
  input.value = '';
  save(); renderAll();
  document.getElementById('cat-msg').textContent = `"${name}" added.`;
  setTimeout(()=>document.getElementById('cat-msg').textContent='', 2500);
}

function deleteCategory(ci) {
  const cat = categories[ci];
  showConfirm('Delete category?', `"${cat}" and all its items will be permanently removed.`, () => {
    categories.splice(ci,1);
    items = items.filter(i=>i.category!==cat);
    save(); renderAll();
  });
}

function addItem(cat) {
  const safeId = cat.replace(/[^a-zA-Z0-9]/g,'_');
  const titleInput = document.getElementById(`new-item-${safeId}`);
  const posSelect = document.getElementById(`pos-${safeId}`);
  const title = titleInput.value.trim();
  if (!title) return;

  const catItems = items.filter(i=>i.category===cat).sort((a,b)=>a.position-b.position);
  const posVal = posSelect.value;

  // Determine insert index
  let insertAfter;
  if (posVal === 'end') insertAfter = catItems.length - 1;
  else if (posVal === '-1') insertAfter = -1;
  else insertAfter = parseInt(posVal);

  const newItem = { id: Date.now() + '_' + Math.random().toString(36).slice(2,6), category: cat, title, position: 0 };

  // Rebuild positions
  catItems.splice(insertAfter + 1, 0, newItem);
  catItems.forEach((item,i) => item.position = i);

  // Update items array
  items = items.filter(i=>i.category!==cat).concat(catItems);

  titleInput.value = '';
  save(); renderAdmin();
}

function deleteItem(id) {
  const item = items.find(i=>i.id===id);
  if (!item) return;
  showConfirm('Remove item?', `"${item.title}" will be removed from the list.`, () => {
    items = items.filter(i=>i.id!==id);
    // Renumber remaining
    const catItems = items.filter(i=>i.category===item.category).sort((a,b)=>a.position-b.position);
    catItems.forEach((it,idx)=>it.position=idx);
    save(); renderAdmin();
  });
}

function renderAll() { renderQueue(); renderAdmin(); }

function switchTab(name) {
  ['queue','admin'].forEach(n => {
    document.getElementById('tab-'+n).classList.toggle('active', n===name);
  });
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['queue','admin'][i]===name));
}

    document.getElementById('loading-screen').style.display='flex';

}

  if (localStorage.getItem('bruh-auth')==='1') { loadAll(); }
  else { document.getElementById('login-screen').style.display='flex'; document.getElementById('loading-screen').style.display='none'; }
}

init();
</script>
